    <!-- Google tag (gtag.js) — deferred load -->
    <script>
      // Set up dataLayer + gtag stub IMMEDIATELY so trackEvent() calls
      // anywhere in the app buffer into dataLayer with zero loss.
      // Then defer the 164 KB gtag.js download until first user
      // interaction or 3s idle, whichever fires first. When gtag.js
      // arrives it drains the queue, so no events are dropped.
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', 'G-LJ6XE6JK2L', { send_page_view: false });

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          ['scroll', 'keydown', 'mousemove', 'touchstart', 'click'].forEach(function (t) {
            window.removeEventListener(t, loadGtag, true);
          });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-LJ6XE6JK2L';
          document.head.appendChild(s);
        }
        ['scroll', 'keydown', 'mousemove', 'touchstart', 'click'].forEach(function (t) {
          window.addEventListener(t, loadGtag, { capture: true, passive: true, once: true });
        });
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadGtag, { timeout: 3000 });
        } else {
          setTimeout(loadGtag, 3000);
        }
      })();
    </script>

    <!-- Boot watchdog. Deliberately a CLASSIC inline script, not type="module":
         it must run even when the module graph never executes, which is exactly
         the failure this exists to surface. Nothing here depends on React or
         any bundle. -->
    <script>
      (function () {
        var BOOT_ID = 'tmh-boot';
        var FLAG = 'tmh-boot-reload';
        var TIMEOUT_MS = 8000; // generous: must not reload out from under slow mobile

        window.__tmhBootErrors = [];

        // Resource/script load failures do NOT bubble — capture phase is required.
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            var url = t && (t.src || t.href);
            if (url) {
              // The datum we could never capture: WHICH resource failed.
              window.__tmhBootErrors.push({ url: String(url), tag: t.tagName, at: Date.now() });
              if (window.console && console.error) {
                console.error('[tmh-boot] resource failed to load:', url, '(' + t.tagName + ')');
              }
            } else if (e && e.message && window.console && console.error) {
              console.error('[tmh-boot] script error:', e.message, e.filename || '', e.lineno || '');
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          if (window.console && console.error) {
            console.error('[tmh-boot] unhandled rejection:', (r && r.message) || String(r));
          }
        });

        // Arms the one-shot guard. Returns true ONLY on confirmed write-then-read,
        // so a failed write can never let us reload unguarded (that would loop).
        function armGuard() {
          try {
            sessionStorage.setItem(FLAG, '1');
            return sessionStorage.getItem(FLAG) === '1';
          } catch (err) {
            return false;
          }
        }
        function alreadyReloaded() {
          try {
            return sessionStorage.getItem(FLAG) === '1';
          } catch (err) {
            return true; // storage unavailable -> fail closed, never reload
          }
        }

        setTimeout(function () {
          // React replaces #root's subtree on mount, so the placeholder's
          // presence after the timeout means the app never booted.
          if (!document.getElementById(BOOT_ID)) return;

          var failed = window.__tmhBootErrors.map(function (x) { return x.url; });
          if (window.console && console.error) {
            console.error(
              '[tmh-boot] app did not mount within ' + TIMEOUT_MS + 'ms.',
              'Failed resources:', failed.length ? failed : '(none captured)'
            );
          }

          try {
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'boot_failure', {
                route: location.pathname,
                failed_count: failed.length,
                first_failed_url: failed[0] ? String(failed[0]).slice(0, 300) : undefined,
                protocol: (performance.getEntriesByType('navigation')[0] || {}).nextHopProtocol
              });
            }
          } catch (err) {
            /* analytics must never block recovery */
          }

          if (!alreadyReloaded() && armGuard()) {
            var u = new URL(location.href);
            u.searchParams.set('tmhb', String(Date.now())); // cache-busting
            location.replace(u.href);
          }
        }, TIMEOUT_MS);

        // Clear the guard once the app is confirmed mounted, so a later
        // session can recover again.
        var settle = setInterval(function () {
          if (!document.getElementById(BOOT_ID)) {
            clearInterval(settle);
            try { sessionStorage.removeItem(FLAG); } catch (err) { /* nothing to clear */ }
          }
        }, 500);
        setTimeout(function () { clearInterval(settle); }, 30000);
      })();
    </script>

  <body>
    <!-- Boot placeholder. Visible immediately from static HTML, so a failure
         BEFORE the entry module executes shows brand, not a black screen.
         React replaces the whole subtree on mount. The id is what the
         boot-watchdog in <head> checks for. -->
    <div id="root">
      <div id="tmh-boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;padding:24px;text-align:center">
